<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Ехо-тренажер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="trainer">
  <div id="beatFrame"></div>
  <header class="topbar">
    <button id="goBtn" class="big primary">▶ Почати</button>
    <nav id="stages" class="stages">
      <span data-stage="warmup">Розминка</span>
      <span data-stage="review">Повторення</span>
      <span data-stage="new">Нове</span>
    </nav>
    <span class="muted version">v0.2</span>
  </header>

  <main class="trainer-main">
    <section class="card stage-card">
      <div class="phrase-head">
        <div>
          <div id="phraseTitle" class="phrase-title">Натисни «Почати»</div>
          <div id="phraseSub" class="muted small"></div>
        </div>
        <div class="head-right">
          <div id="streak" class="streak"></div>
          <div id="micLabel" class="muted small"></div>
        </div>
      </div>

      <div id="grid" class="grid"></div>

      <div id="plate" class="result rec"></div>

      <div class="row">
        <button id="againBtn" class="big" disabled>↻ Послухати ще раз</button>
        <button id="skipBtn" class="big" disabled>Пропустити</button>
      </div>
    </section>

    <section class="card">
      <details id="settingsBox">
        <summary>Налаштування</summary>
        <div class="settings">
          <label class="inline">Звук
            <select id="kitSelect"><option value="pad">Мій пад</option><option value="snare">Малий барабан</option></select>
          </label>
          <label class="inline">Оцінка
            <select id="strictSelect"></select>
          </label>
          <label class="slider">
            <span>Чутливість мікрофона: <b id="sensVal"></b></span>
            <input id="sens" type="range" min="0" max="30" step="1">
            <span class="muted small">Удари губляться — праворуч. Ловить зайве (кімнату, хвіст пада) — ліворуч.</span>
          </label>
          <label class="slider">
            <span>Метроном: <b id="metroVal"></b></span>
            <input id="metro" type="range" min="0" max="100" step="5">
          </label>
          <label class="inline check"><input id="leftTopCheck" type="checkbox"> Ліва рука зверху</label>
          <label class="inline check"><input id="blinkCheck" type="checkbox"> Мигалка: рамка екрана блимає на кожну долю</label>
          <label class="inline check"><input id="replayCheck" type="checkbox"> «Як я зіграв»: після кожної спроби програти її звуком барабана</label>
          <p class="muted small">Мікрофон, чутливість, записи пада і калібрування затримки — на <a href="test.html">сторінці тесту</a>.</p>
        </div>
      </details>
    </section>
  </main>

  <script type="module" src="trainer.js"></script>
</body>
</html>
